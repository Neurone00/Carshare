name: Android Build

on:
  push:
    branches:
      - claude/android-screen-share-toyota-d9efse
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APKs
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }} --stacktrace

      - name: Generate update manifest
        run: |
          cat > update.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "url": "https://github.com/${{ github.repository }}/releases/download/latest-build/voicevolume-debug.apk",
            "notes": "Build automatica ${{ github.run_number }}"
          }
          EOF
          cat update.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carshare-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            voicevolume/build/outputs/apk/debug/voicevolume-debug.apk
            update.json
          if-no-files-found: error

      - name: Publish to Release (latest-build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest debug build
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            voicevolume/build/outputs/apk/debug/voicevolume-debug.apk
            update.json
