name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew --no-daemon :core:test

      - name: Build APKs
        env:
          ADBRELLA_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Collect outputs and write update manifest
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/adbrella-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/adbrella.apk
          SHA=$(sha256sum out/adbrella.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s out/adbrella.apk)
          cat > out/update.json <<JSON
          {
            "versionCode": $BUILD_NUMBER,
            "versionName": "1.$BUILD_NUMBER",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/adblock-latest/adbrella.apk",
            "sha256": "$SHA",
            "size": $SIZE,
            "commit": "${{ github.sha }}"
          }
          JSON
          cat out/update.json

      - uses: actions/upload-artifact@v4
        with:
          name: adbrella-apk
          path: out/*

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

      - name: Publish "latest build" prerelease
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: adblock-latest
          name: Adbrella (latest build)
          prerelease: true
          body: |
            ☂ Adbrella build 1.${{ github.run_number }} from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Install **adbrella.apk** on the phone. Once installed, the app updates itself from this page.
          files: |
            out/adbrella.apk
            out/adbrella-debug.apk
            out/update.json

      - name: GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/adbrella.apk
            out/update.json
