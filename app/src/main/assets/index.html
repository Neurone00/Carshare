<!doctype html>
<html lang="it">
<head>

    <title>Carshare — Passenger Screen</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; height: 100%;
            font-family: system-ui, -apple-system, Roboto, sans-serif;
            background: #0b0f19; color: #e7ecf3;
        }
        body {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 1.5rem; text-align: center; padding: 2rem;
        }
        h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 700; }
        p  { margin: 0; color: #9aa7b8; font-size: clamp(1rem, 2vw, 1.3rem); max-width: 40ch; }
        .badge {
            font-size: .8rem; letter-spacing: .1em; text-transform: uppercase;
            color: #7dd3fc; border: 1px solid #1e3a52; border-radius: 999px;
            padding: .4rem 1rem;
        }
    </style>
</head>
<body>
    <span class="badge">Carshare · Passenger Display</span>
    <h1>Schermo passeggero pronto</h1>
    <p>Pagina di test locale. Avvia l'app con un URL per caricare i tuoi contenuti multimediali.</p>

</html>
